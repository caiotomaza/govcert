services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: laravel-app
    container_name: app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./src:/var/www
    networks:
      - laravel-network
    depends_on:
      - db
      - redis

  webserver:
    image: nginx:alpine
    container_name: webserver
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./src:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - laravel-network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: govcert_dev
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: govcert_user
      MYSQL_PASSWORD: root
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - laravel-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadmin
    restart: unless-stopped
    profiles: ["dev"]
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "8080:80"
    networks:
      - laravel-network
    depends_on:
      - db

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - laravel-network

  queue_worker:
    image: laravel-app
    container_name: queue_worker
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./src:/var/www
    command: php artisan queue:work redis --queue=gemini,default --sleep=3 --tries=3 --max-time=3600 --max-jobs=500
    networks:
      - laravel-network
    depends_on:
      - app
      - redis
      - db

  scheduler:
    image: laravel-app
    container_name: scheduler
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./src:/var/www
    command: php artisan schedule:work
    networks:
      - laravel-network
    depends_on:
      - app
      - redis
      - db

  mailpit:
    image: 'axllent/mailpit:latest'
    container_name: mailpit
    restart: unless-stopped
    profiles: ["dev"]
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - laravel-network

networks:
  laravel-network:
    driver: bridge

volumes:
  dbdata:
  redisdata: